name: npm-token-diag
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          registry-url: 'https://registry.npmjs.org'
      - name: whoami
        run: npm whoami || echo "WHOAMI_FAILED"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: publish test pkg
        run: |
          mkdir -p /tmp/t && cd /tmp/t
          npm init -y >/dev/null
          PKG="cabrasky-diag-$(date +%s)"
          npm pkg set name="$PKG" version="1.0.0"
          npm publish --access public || echo "PUBLISH_FAILED"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
